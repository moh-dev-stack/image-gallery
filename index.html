<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Asset Gallery</h1>
    <p>Images and PDFs. Click to view full screen. Zoom and pan images.</p>
  </header>

  <main class="gallery">
    <div class="gallery-grid" id="gallery-grid">
      <p class="gallery-loading">Loading assets…</p>
    </div>
  </main>

  <!-- Full-screen lightbox with zoom -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox-close" aria-label="Close">&times;</button>
    <div class="lightbox-toolbar">
      <button class="lightbox-zoom-in" aria-label="Zoom in">+</button>
      <button class="lightbox-zoom-out" aria-label="Zoom out">−</button>
      <button class="lightbox-reset" aria-label="Reset view">Reset</button>
      <button class="lightbox-fullscreen" aria-label="Full screen">⛶</button>
    </div>
    <div class="lightbox-viewport">
      <div class="lightbox-pan lightbox-pan--image">
        <img src="" alt="" id="lightbox-img">
      </div>
      <iframe id="lightbox-pdf" class="lightbox-pdf" title="PDF viewer"></iframe>
    </div>
    <p class="lightbox-caption" id="lightbox-caption"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
